<!-- ================================================================
     THEME BLOCK — LEIP_visual_direction.md, one-to-one. Game logic
     references these tokens only; a raw colour or font name anywhere
     else is a bug (spec §8).
     ================================================================ -->
<script id="leip-theme">
globalThis.LEIP_THEME = {
  // Colour — atmosphere by time of day. One tint at a time; the week
  // cycles continuously. Flat colour and soft two-stop gradients only.
  scenes: {
    dawn:  { sea: '#8FB8B2', sky: '#EFC3AC', land: '#E0A995' },
    day:   { sea: '#6FB5AF', sky: '#BFE3DC', land: '#EAD9BC' },
    dusk:  { sea: '#5E8FA3', sky: '#E58F7B', land: '#C77E6E' },
    night: { sea: '#22345C', sky: '#141F3D', land: '#2C3B60' }
  },
  sceneOrder: ['dawn', 'day', 'dusk', 'night'],  // cycle order across each day
  sceneHours: { dawn: 6, day: 11, dusk: 19, night: 22 },  // local hour each scene is centred on

  // Ink (chart layer): flips as one between light-scene and night ink.
  ink: { onLight: '#22344A', onDark: '#E8EEF2' },

  // VOLT — the single accent, energy only, <= 10% of any screen.
  volt: '#F5D90A',
  dieselSmoke: '#8A8578',
  signalRed: '#C4442A',        // results screen only

  world: {
    yachtHull: '#F7F4ED',      // matte white, no gloss
    yachtTeak: '#C9A876',      // fine teak deck line
    foam: '#FFFFFF',           // crisp geometric foam strokes
    // three tones per mass: lit / mid / shade (multipliers on scene land colour)
    massTones: { lit: 1.06, mid: 0.9, shade: 0.76 },
    seaDeep: 0.92              // sea-field edge darkening multiplier
  },

  chart: {
    graticuleAlpha: 0.28,
    soundingsAlpha: 0.45,
    hatchSpacingPx: 5,
    routeDash: [6, 5],         // thin dashed rhumb lines, px at chart scale
    waypointTickPx: 7,
    annotationGapPx: 4
  },

  type: {
    ui: "'Saira SemiCondensed', 'Saira', system-ui, sans-serif",
    data: "'OCR-A-LEIP', 'OCR A Extended', monospace",   // every number & short data label
    portNameSpacingEm: 0.28,   // port names in spaced caps
    maxWeight: 600             // nothing above 600 weight
  },

  hud: {                        // the title block
    cellRulePx: 1,
    panelRulePx: 1.5,
    labelPx: 10,
    valuePx: 16,
    panelWidthPx: 300,
    dotRadiusPx: 5
  },

  lines: { hairlinePx: 1, rulePx: 1.5, routePx: 1.75 },

  motion: {
    weekSeconds: 75,           // one charter week of playback
    tintCrossfadeShare: 0.25,  // fraction of each scene span spent crossfading
    resultsStampMs: 900,       // results assemble like a drawing being stamped
    countUpMs: 1200,
    respectReducedMotion: true
  },

  shareCard: { w: 1080, h: 1920 }   // story format, canvas-rendered
};
</script>

<!-- ================================================================
     ENGINE BLOCK — pure, deterministic simulation & scoring (spec §3,
     §5, §6, §7, §8-leaderboard). No DOM, no Three.js, no randomness
     (Random Spin takes an injected rng). Identical inputs always
     produce identical outputs.
     ================================================================ -->
<script id="leip-engine">
globalThis.LEIP_ENGINE = (function () {
  'use strict';

  var EARTH_R_NM = 3440.065;
  var EPS = 1e-9;

  function D() { return globalThis.LEIP_DATA; }
  function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }
  function toRad(deg) { return deg * Math.PI / 180; }
  function arrEq(a, b) {
    if (a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }

  function haversineNm(a, b) {
    var dLat = toRad(b.lat - a.lat), dLon = toRad(b.lon - a.lon);
    var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
    return 2 * EARTH_R_NM * Math.asin(Math.min(1, Math.sqrt(s)));
  }

  function portByName(name) {
    var ports = D().ports;
    for (var i = 0; i < ports.length; i++) if (ports[i].name === name) return ports[i];
    return null;
  }
  function activityById(id) {
    var acts = D().activities;
    for (var i = 0; i < acts.length; i++) if (acts[i].id === id) return acts[i];
    return null;
  }

  // Propulsion power (bkW) at a given speed. Below the first curve point:
  // propeller cube law anchored at that point; linear between points;
  // clamped above the last (documented calibration assumption).
  function propBkwAt(kts) {
    var c = D().propCurve;
    if (kts <= c[0].kts) {
      var r = kts / c[0].kts;
      return c[0].bkw * r * r * r;
    }
    for (var i = 1; i < c.length; i++) {
      if (kts <= c[i].kts) {
        var f = (kts - c[i - 1].kts) / (c[i].kts - c[i - 1].kts);
        return c[i - 1].bkw + f * (c[i].bkw - c[i - 1].bkw);
      }
    }
    return c[c.length - 1].bkw;
  }

  // HUD mode label: nearest prop-curve point to the given speed.
  function modeAtKts(kts) {
    var c = D().propCurve, best = c[0], bd = Infinity;
    for (var i = 0; i < c.length; i++) {
      var dd = Math.abs(c[i].kts - kts);
      if (dd < bd) { bd = dd; best = c[i]; }
    }
    return best.gameMode;
  }

  // Underway statistics for a toggle profile: knot bins at or below the
  // stationary cutoff are station-keeping (stationary time), excluded
  // from the passage distribution and renormalised.
  function profileStats(profileName) {
    var d = D();
    var pct = d.speedProfiles[profileName].pctPerKnot;
    var cut = d.calibration.stationaryKnotCutoff;
    var tot = 0, kts = [];
    Object.keys(pct).forEach(function (k) {
      var v = Number(k);
      if (v > cut) { kts.push(v); tot += pct[k]; }
    });
    var vEff = 0, avgBkw = 0, bands = [];
    kts.sort(function (a, b) { return a - b; }).forEach(function (v) {
      var f = pct[v] / tot;
      vEff += f * v;
      avgBkw += f * propBkwAt(v);
      bands.push({ kts: v, frac: f });
    });
    return { vEff: vEff, avgBkw: avgBkw, bands: bands };
  }

  function toggleProfile(speed) {
    var t = D().speedToggles[speed];
    return t ? t.profile : D().speedToggles.slow.profile;
  }

  // Shared energy model — the single place route energy is computed, used
  // by both the in-game week and the poster-assumption basis.
  //  distNm over hours with a profile -> { underwayH, hotelMwh, travelMwh }
  function energyFor(distNm, hours, profileName) {
    var d = D(), cal = d.calibration, hl = d.hotelLoadsEkw;
    var ps = profileStats(profileName);
    var underwayH = ps.vEff > 0 ? Math.min(distNm / ps.vEff, hours) : 0;
    var hotelMwh = (hl.stationaryGuestAnchor * (hours - underwayH) +
                    hl.underwayGuestTransit * underwayH) * cal.hotelUtilisation / 1000;
    var travelMwh = ps.avgBkw * cal.propFactor[profileName] * underwayH / 1000;
    return { underwayH: underwayH, hotelMwh: hotelMwh, travelMwh: travelMwh, stats: ps };
  }

  // Poster-assumption basis (spec §6 calibration): published nm over
  // published days with the Typical profile — "same assumptions as the
  // sheets". Returns simulated MWh for the parity table.
  function posterAssumptionMwh(poster) {
    var e = energyFor(poster.nm, poster.days * 24, 'Typical');
    return e.hotelMwh + e.travelMwh;
  }

  function normalizeInputs(raw) {
    var d = D();
    raw = raw || {};
    var route = [];
    if (Array.isArray(raw.route)) {
      for (var i = 0; i < raw.route.length; i++) if (portByName(raw.route[i])) route.push(raw.route[i]);
    }
    var speed = d.speedToggles[raw.speed] ? raw.speed : 'slow';
    var nights = clamp(Math.round(Number(raw.nights) || 0), 0, d.time.nights);
    var activities = {};
    if (raw.activities) {
      Object.keys(raw.activities).forEach(function (id) {
        var act = activityById(id);
        var n = Math.round(Number(raw.activities[id]) || 0);
        if (act && n > 0) activities[id] = clamp(n, 1, act.maxPerWeek);
      });
    }
    return { route: route, speed: speed, nights: nights, activities: activities };
  }

  function tableLookup(table, n) {
    var keys = Object.keys(table).map(Number).sort(function (a, b) { return a - b; });
    var k = clamp(n, keys[0], keys[keys.length - 1]);
    if (table[k] !== undefined) return table[k];
    for (var i = keys.length - 1; i >= 0; i--) if (keys[i] <= k) return table[keys[i]];
    return table[keys[0]];
  }

  function activitiesFactor(activities, cfg) {
    var ids = Object.keys(activities);
    if (ids.length === 0) return tableLookup(cfg.varietyTable, 0);
    var cats = {}, spam = 0;
    ids.forEach(function (id) {
      cats[activityById(id).category] = true;
      spam += Math.max(0, activities[id] - cfg.spamThreshold) * cfg.spamPenaltyPerExcess;
    });
    var score = tableLookup(cfg.varietyTable, ids.length) +
                (Object.keys(cats).length >= 2 ? cfg.bothCategoriesBonus : 0) - spam;
    return clamp(score, cfg.clampMin, cfg.clampMax);
  }

  // Results-screen fun metric (display flavour; never touches the score).
  function funMetric(activities, cfg) {
    var fun = 0;
    Object.keys(activities).forEach(function (id) {
      var act = activityById(id);
      for (var k = 1; k <= activities[id]; k++) {
        fun += act.fun * (k <= cfg.funSoftCap ? 1 : Math.pow(cfg.funDecay, k - cfg.funSoftCap));
      }
    });
    return Math.round(fun * 10) / 10;
  }

  function simulate(rawInputs) {
    var d = D();
    var inputs = normalizeInputs(rawInputs);
    if (inputs.route.length < 1) throw new Error('Route needs at least a starting port.');

    var T = d.time;
    var profileName = toggleProfile(inputs.speed);

    // Legs: pure haversine between true coordinates (spec §3).
    var legs = [];
    for (var i = 0; i + 1 < inputs.route.length; i++) {
      var a = portByName(inputs.route[i]), b = portByName(inputs.route[i + 1]);
      legs.push({ from: a.name, to: b.name, nm: haversineNm(a, b) * d.nav.routeFactor });
    }
    var distanceNm = legs.reduce(function (s, l) { return s + l.nm; }, 0);

    // Time budget: anchor nights are nights not spent transiting.
    var stats = profileStats(profileName);
    var requiredH = stats.vEff > 0 ? distanceNm / stats.vEff : 0;
    var transitBudgetH = T.charterHours - inputs.nights * T.nightAnchorHours;
    var completed = requiredH <= transitBudgetH + EPS;
    var coveredNm = completed ? distanceNm : transitBudgetH * stats.vEff;

    // Energy over the fixed 168 h week (the covered distance).
    var e = energyFor(coveredNm, T.charterHours, profileName);
    var underwayH = e.underwayH;
    var anchorH = T.charterHours - underwayH;      // derived anchor time (spec §3)
    var activitiesMwh = 0;
    Object.keys(inputs.activities).forEach(function (id) {
      activitiesMwh += activityById(id).energyPct * d.scoring.weeklyEnergyRefMwh * inputs.activities[id];
    });
    var totalMwh = e.hotelMwh + e.travelMwh + activitiesMwh;

    // Poster parity (spec §6). Exact replication = same port sequence,
    // slow toggle (the sheets' Typical basis), no activities. The game
    // must output the published figure; overrideEngaged records whether
    // first-principles calibration was outside ±tolerance.
    var poster = null, posterInfo = null;
    for (var p = 0; p < d.posterRoutes.length; p++) {
      if (arrEq(d.posterRoutes[p].ports, inputs.route)) { poster = d.posterRoutes[p]; break; }
    }
    if (poster) {
      var exact = inputs.speed === 'slow' && Object.keys(inputs.activities).length === 0;
      var simSheet = posterAssumptionMwh(poster);
      posterInfo = {
        id: poster.id, name: poster.name, publishedMwh: poster.mwh,
        exactReplica: exact,
        sheetBasisSimMwh: simSheet,
        overrideEngaged: exact && Math.abs(simSheet - poster.mwh) > d.calibration.posterToleranceMwh
      };
      if (exact) totalMwh = poster.mwh;   // the board number is the published figure
    }

    var cap = d.battery.gameThresholdMwh;
    var batteryMwh = Math.min(totalMwh, cap);
    var dieselMwh = Math.max(0, totalMwh - cap);

    // Ports actually reached (doomed routes run and simply suffer).
    var reached = [inputs.route[0]];
    var cum = 0, legFracs = [];
    legs.forEach(function (leg) {
      cum += leg.nm;
      if (cum <= coveredNm + 1e-6) { reached.push(leg.to); legFracs.push(1); }
      else legFracs.push(clamp(leg.nm > 0 ? (coveredNm - (cum - leg.nm)) / leg.nm : 0, 0, 1));
    });

    // Playback timeline: anchor time split across reached stops, transits
    // between. Presentational scheduling; totals above are authoritative
    // and per-segment rates reproduce them exactly.
    var stops = reached.length;
    var anchorPer = anchorH / stops;
    var actKw = activitiesMwh * 1000 / T.charterHours;
    var cal = d.calibration, hl = d.hotelLoadsEkw;
    var hotelStatKw = hl.stationaryGuestAnchor * cal.hotelUtilisation;
    var hotelUwKw = hl.underwayGuestTransit * cal.hotelUtilisation;
    var propKw = stats.avgBkw * cal.propFactor[profileName];
    // If the poster snap adjusted the total, spread the delta as a flat
    // correction so the playback battery track still ends at totalMwh.
    var rawTotal = e.hotelMwh + e.travelMwh + activitiesMwh;
    var snapKw = (totalMwh - rawTotal) * 1000 / T.charterHours;

    var timeline = [];
    var t = 0;
    function push(seg) { seg.startH = t; t += seg.hours; seg.endH = t; timeline.push(seg); }
    for (var s = 0; s < stops; s++) {
      var isLast = s === stops - 1;
      var dur = (isLast && completed) ? Math.max(0, T.charterHours - t) : anchorPer;
      push({ type: 'anchor', port: reached[s], hours: dur });
      if (!isLast) {
        push({ type: 'transit', from: legs[s].from, to: legs[s].to, nm: legs[s].nm,
               hours: legs[s].nm / stats.vEff, frac: 1 });
      } else if (!completed && s < legs.length) {
        push({ type: 'transit', from: legs[s].from, to: legs[s].to, nm: legs[s].nm * legFracs[s],
               hours: Math.max(0, T.charterHours - t), frac: legFracs[s], partial: true });
      }
    }

    var cumMwh = 0, dieselStartH = null;
    timeline.forEach(function (seg) {
      seg.powerKw = actKw + snapKw + (seg.type === 'transit' ? hotelUwKw + propKw : hotelStatKw);
      seg.startMwh = cumMwh;
      var segMwh = seg.powerKw * seg.hours / 1000;
      if (dieselStartH === null && cumMwh < cap && cumMwh + segMwh > cap) {
        dieselStartH = seg.startH + (cap - cumMwh) / (seg.powerKw / 1000);
      }
      cumMwh += segMwh;
      seg.endMwh = cumMwh;
    });
    if (dieselMwh > 0 && dieselStartH === null) dieselStartH = T.charterHours;

    // ---- Base (0-100): pure energy performance (spec §5).
    var bc = d.scoring.base;
    var nmPerMwh = totalMwh > 0 ? coveredNm / totalMwh : 0;
    var effPart = bc.efficiencyWeight * clamp(nmPerMwh / bc.effRefNmPerMwh, 0, 1);
    var discPart = bc.disciplineWeight - bc.dieselPenaltyPerMwh * dieselMwh;
    var rawBase = discPart + effPart - (completed ? 0 : bc.incompletePenalty);
    var base = clamp(Math.round(rawBase), bc.min, bc.max);

    // ---- Multiplier (-10..+10): five factors, averaged (spec §5).
    var mc = d.scoring.multiplier;
    var distinctPorts = reached.filter(function (n, idx) { return reached.indexOf(n) === idx; });
    var countries = [];
    distinctPorts.forEach(function (n) {
      var c = portByName(n).country;
      if (countries.indexOf(c) < 0) countries.push(c);
    });
    var rechargePortName = inputs.route[inputs.route.length - 1];
    var rechargePort = portByName(rechargePortName);
    var factors = {
      countries:  { value: countries.length,     score: tableLookup(mc.countries, countries.length) },
      ports:      { value: distinctPorts.length, score: tableLookup(mc.ports, distinctPorts.length) },
      activities: { value: Object.keys(inputs.activities).length,
                    score: activitiesFactor(inputs.activities, mc.activities) },
      nights:     { value: inputs.nights,        score: tableLookup(mc.nights, inputs.nights) },
      recharge:   { port: rechargePortName, energy: rechargePort.energy, reached: completed,
                    score: completed ? mc.recharge[rechargePort.energy] : mc.rechargeNotReached }
    };
    var factorSum = factors.countries.score + factors.ports.score + factors.activities.score +
                    factors.nights.score + factors.recharge.score;
    var multiplier = factorSum / 5;
    var final = Math.round(base * multiplier * 10) / 10;

    return {
      inputs: inputs,
      profile: profileName,
      distanceNm: distanceNm, coveredNm: coveredNm, completed: completed,
      vEffKts: stats.vEff, cruiseMode: modeAtKts(stats.vEff),
      underwayH: underwayH, anchorH: anchorH, transitBudgetH: transitBudgetH,
      hotelMwh: e.hotelMwh, travelMwh: e.travelMwh, activitiesMwh: activitiesMwh,
      totalMwh: totalMwh, batteryMwh: batteryMwh, dieselMwh: dieselMwh,
      dieselStartH: dieselStartH,
      reached: reached, distinctPorts: distinctPorts, countries: countries,
      rechargePort: rechargePortName,
      poster: posterInfo,
      timeline: timeline,
      funMetric: funMetric(inputs.activities, mc.activities),
      score: { base: base, rawBase: rawBase, factors: factors, factorSum: factorSum,
               multiplier: multiplier, final: final }
    };
  }

  // Hour a port is first reached (mid-sim achievement triggers).
  function arrivalHour(sim, portName) {
    if (sim.inputs.route[0] === portName) return 0;
    for (var i = 0; i < sim.timeline.length; i++) {
      var seg = sim.timeline[i];
      if (seg.type === 'transit' && seg.to === portName && !seg.partial) return seg.endH;
      if (seg.type === 'anchor' && seg.port === portName && seg.startH > 0) return seg.startH;
    }
    return null;
  }

  // ---- Achievements (spec §7): trophies only, zero score effect. ----
  // persistent: { unlocked:{id:true}, posterDone:[posterId], repeatCount:n }
  function evaluateAchievements(sim, persistentIn) {
    var d = D(), cfg = d.achievements, th = cfg.thresholds;
    var p = { unlocked: {}, posterDone: [], repeatCount: 0 };
    if (persistentIn) {
      Object.keys(persistentIn.unlocked || {}).forEach(function (k) { p.unlocked[k] = true; });
      (persistentIn.posterDone || []).forEach(function (r) { p.posterDone.push(r); });
      p.repeatCount = persistentIn.repeatCount || 0;
    }
    var newly = [];
    function unlock(id, atHour) {
      if (!p.unlocked[id]) {
        p.unlocked[id] = true;
        newly.push({ id: id, atHour: atHour === undefined ? null : atHour });
      }
    }

    if (sim.completed && portByName(sim.rechargePort).energy === 'green') unlock('green-charge');
    if (sim.score.final > th.scoreOver) unlock('score-900');
    if (sim.dieselMwh > 0) unlock('mwh-hit', sim.dieselStartH);
    var hasDive = Object.keys(sim.inputs.activities).some(function (id) {
      return cfg.diveActivityIds.indexOf(id) >= 0;
    });
    var atDiveSpot = sim.reached.some(function (n) {
      return portByName(n).tags.indexOf(cfg.divePortTag) >= 0;
    });
    if (hasDive && atDiveSpot) unlock('submerged-ruins');
    if (sim.poster && sim.completed && p.posterDone.indexOf(sim.poster.id) < 0) p.posterDone.push(sim.poster.id);
    if (p.posterDone.length >= th.posterRoutesRequired) unlock('five-routes');
    if (sim.coveredNm > th.longHaulNm) unlock('long-haul');
    if (sim.countries.length >= th.worldTravellerCountries) unlock('world-traveller');
    var sanPort = null;
    d.ports.forEach(function (port) { if (port.tags.indexOf(cfg.santoriniTag) >= 0) sanPort = port; });
    if (sanPort && sim.reached.indexOf(sanPort.name) >= 0) unlock('volcano-chief', arrivalHour(sim, sanPort.name));
    if (sim.score.final >= th.repeatClientMinScore) p.repeatCount += 1;
    if (p.repeatCount >= th.repeatClientCharters) unlock('repeat-client');

    return { newly: newly, persistent: p };
  }

  // ---- Lifetime leaderboard (spec §8) — pure logic; storage is the
  // app layer's concern. Name is required: saving without one is
  // impossible by construction (spec §11.7).
  function leaderboardEntry(sim, name, dateIso) {
    var d = D(), lb = d.leaderboard;
    name = String(name === undefined || name === null ? '' : name).trim();
    if (name.length < lb.nameMinLen) return null;
    name = name.slice(0, lb.nameMaxLen).toUpperCase();
    var r = sim.inputs.route;
    return {
      name: name,
      score: sim.score.final,
      base: sim.score.base,
      multiplier: sim.score.multiplier,
      route: r[0] + (r.length > 1 ? ' → ' + r[r.length - 1] : ''),
      ports: sim.distinctPorts.length,
      countries: sim.countries.length,
      date: dateIso
    };
  }
  function leaderboardInsert(board, entry) {
    if (!entry) return { board: (board || []).slice(), rank: -1 };
    var next = (board || []).slice();
    next.push(entry);
    next.sort(function (a, b) { return b.score - a.score || String(a.date).localeCompare(String(b.date)); });
    next = next.slice(0, D().leaderboard.maxEntries);
    return { board: next, rank: next.indexOf(entry) };
  }

  // ---- Random Spin (spec §2.6): genuinely chaotic, no sanitising.
  function randomSpin(rng) {
    rng = rng || Math.random;
    var d = D(), cfg = d.randomSpin;
    var nPicks = cfg.minPicks + Math.floor(rng() * (cfg.maxPicks - cfg.minPicks + 1));
    var route = [];
    for (var i = 0; i < nPicks; i++) route.push(d.ports[Math.floor(rng() * d.ports.length)].name);
    var activities = {};
    d.activities.forEach(function (act) {
      if (rng() < cfg.activityChance) activities[act.id] = 1 + Math.floor(rng() * act.maxPerWeek);
    });
    var speeds = Object.keys(d.speedToggles);
    return normalizeInputs({
      route: route,
      speed: speeds[Math.floor(rng() * speeds.length)],
      nights: Math.floor(rng() * (d.time.nights + 1)),
      activities: activities
    });
  }

  return {
    haversineNm: haversineNm,
    portByName: portByName,
    activityById: activityById,
